# Production deployment: docker compose up -d
# Put a TLS reverse proxy (see docker/Caddyfile) in front, or uncomment the caddy service.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-itdocs}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itdocs}"]
      interval: 10s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-itdocs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-itdocs}
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    volumes: [uploads:/app/data/uploads]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups]
    depends_on: [db]
    # Nightly dump at 02:00, keeps 14 days.
    entrypoint: >
      sh -c 'while true; do
        now=$$(date +%H%M); if [ "$$now" = "0200" ]; then
          pg_dump -h db -U ${POSTGRES_USER:-itdocs} -Fc ${POSTGRES_DB:-itdocs} > /backups/itdocs-$$(date +%F).dump;
          find /backups -name "itdocs-*.dump" -mtime +14 -delete; sleep 61; fi; sleep 30; done'

  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   ports: ["80:80", "443:443"]
  #   volumes: [./docker/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data]

volumes:
  db-data:
  uploads:
  # caddy-data:
